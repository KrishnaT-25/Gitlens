name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gitlens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gitlens_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gitlens_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gitlens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: pip install -r requirements-dev.txt
        working-directory: server
      - run: alembic upgrade head
        working-directory: server
      - run: pytest -q
        working-directory: server
      - run: alembic downgrade base && alembic upgrade head
        working-directory: server
      - run: npm ci
        working-directory: extension
      - run: npm run build && npm test && npm run lint
        working-directory: extension
