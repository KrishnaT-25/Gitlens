name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: gitlens_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d gitlens_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gitlens_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gitlens_test
      GEMINI_API_KEY: ''
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements-dev.txt
        working-directory: server
      - run: alembic upgrade head
        working-directory: server
      - name: Backend tests (real PostgreSQL, mocked external providers)
        run: pytest -q
        working-directory: server
      - run: alembic downgrade base && alembic upgrade head
        working-directory: server
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run build
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npm run lint
        if: ${{ !cancelled() }}
